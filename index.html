<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI House Price Predictor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="main-wrapper">
        <header>
            <h1>AI House Predictor</h1>
            <p class="subtitle">Real Estate Insights for India & USA</p>
        </header>

        <main class="container">
            <section class="card-outer">
                <form id="predictionForm" class="form-grid">

                    <!-- Location Selector - Prominent Position -->
                    <div class="input-outer location-select">
                        <label for="Location">Select Location</label>
                        <select id="Location" required>
                            <optgroup label="🇺🇸 United States">
                                <option value="California, USA" selected>California, USA</option>
                                <option value="New York, USA">New York, USA</option>
                                <option value="Texas, USA">Texas, USA</option>
                                <option value="Florida, USA">Florida, USA</option>
                                <option value="Washington, USA">Washington, USA</option>
                                <option value="Illinois, USA">Illinois, USA</option>
                            </optgroup>
                            <optgroup label="🇮🇳 India">
                                <option value="Mumbai, India">Mumbai, India</option>
                                <option value="Delhi, India">Delhi, India</option>
                                <option value="Bangalore, India">Bangalore, India</option>
                                <option value="Hyderabad, India">Hyderabad, India</option>
                                <option value="Chennai, India">Chennai, India</option>
                                <option value="Pune, India">Pune, India</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="input-outer">
                        <label for="MedInc">Median Income ($10k)</label>
                        <input type="number" id="MedInc" step="0.1" value="3.5" required>
                    </div>
                    <div class="input-outer">
                        <label for="HouseAge">House Age (Years)</label>
                        <input type="number" id="HouseAge" step="1" value="15" required>
                    </div>
                    <div class="input-outer">
                        <label for="AveRooms">Average Rooms</label>
                        <input type="number" id="AveRooms" step="0.1" value="5.2" required>
                    </div>
                    <div class="input-outer">
                        <label for="AveBedrms">Average Bedrooms</label>
                        <input type="number" id="AveBedrms" step="0.1" value="1.0" required>
                    </div>
                    <div class="input-outer">
                        <label for="Population">Block Population</label>
                        <input type="number" id="Population" step="1" value="1200" required>
                    </div>
                    <div class="input-outer">
                        <label for="AveOccup">Average Occupancy</label>
                        <input type="number" id="AveOccup" step="0.1" value="3.0" required>
                    </div>
                    <div class="input-outer">
                        <label for="Latitude">Latitude</label>
                        <input type="number" id="Latitude" step="0.01" value="34.05" required>
                    </div>
                    <div class="input-outer">
                        <label for="Longitude">Longitude</label>
                        <input type="number" id="Longitude" step="0.01" value="-118.24" required>
                    </div>

                    <button type="submit" class="btn-neumorph" id="predictBtn">
                        Predict House Price
                    </button>
                </form>
            </section>

            <aside class="sidebar">
                <div class="card-outer result-display">
                    <h3>Estimated Price</h3>
                    <div id="loading" class="spinner" style="display: none;"></div>
                    <div id="resultValue" class="price-value">$0.00</div>
                    <span id="locationDisplay" class="price-unit">Select a location</span>
                    <p id="errorMsg" class="error-msg"></p>
                </div>

                <div class="card-outer info-box">
                    <h4>About the Model</h4>
                    <p>Powered by <strong>Linear Regression</strong> trained on California Housing data. Supports
                        <strong>12 locations</strong> across India and USA with localized price predictions.
                    </p>
                </div>
            </aside>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
